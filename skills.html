<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah Skill - AI SkillHub</title>
    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
    <!-- Font Geist -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black font-[Geist] text-sm text-neutral-200">

    <!-- Navbar -->
    <header class="border-b border-neutral-800">
        <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
            <a href="index.html" class="flex items-center gap-2 text-base font-semibold text-neutral-100">
                <img src="assets/images/logo.svg" alt="" width="28" height="28">
                AI SkillHub
            </a>
            <ul class="flex w-full flex-col gap-1 md:w-auto md:flex-row">
                <li><a href="index.html" class="block rounded px-3 py-2 text-neutral-400 hover:bg-neutral-900 hover:text-neutral-100">Dashboard</a></li>
                <li><a href="skills.html" aria-current="page" class="block rounded px-3 py-2 text-neutral-100 hover:bg-neutral-900">Jelajah</a></li>
                <li><a href="skill-form.html" class="block rounded px-3 py-2 text-neutral-400 hover:bg-neutral-900 hover:text-neutral-100">Submit</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-8">

        <h1 class="text-2xl font-semibold text-neutral-100">Jelajah Skill</h1>
        <p class="mt-1 text-neutral-400">Cari skill berdasarkan nama atau kategori (coba ketik "SEO" atau "Python").</p>

        <!-- Form pencarian -->
        <form id="search-form" class="mt-6 grid gap-3 md:grid-cols-[2fr_1fr_auto] md:items-end">
            <div>
                <label for="search-keyword" class="mb-1.5 block font-medium">Kata kunci</label>
                <input type="text" id="search-keyword" name="q" placeholder="React, SEO, security..."
                    class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 placeholder:text-neutral-500 focus:border-neutral-300 focus:outline-none">
            </div>
            <div>
                <label for="filter-category" class="mb-1.5 block font-medium">Kategori</label>
                <select id="filter-category" name="category"
                    class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 focus:border-neutral-300 focus:outline-none">
                    <option value="">Semua</option>
                    <option value="design">Design</option>
                    <option value="development">Development</option>
                    <option value="security">Security</option>
                    <option value="data">Data</option>
                    <option value="writing">Writing</option>
                    <option value="research">Research</option>
                    <option value="automation">Automation</option>
                    <option value="productivity">Productivity</option>
                </select>
            </div>
            <button type="submit" class="rounded bg-neutral-100 px-4 py-2 font-medium text-black hover:bg-neutral-300">Cari Skill</button>
        </form>

        <!-- Tabel data -->
        <div class="mt-8 overflow-x-auto rounded border border-neutral-800">
            <table class="w-full min-w-[640px] text-left">
                <caption class="sr-only">Daftar AI Skills</caption>
                <thead class="bg-neutral-950 text-xs text-neutral-400">
                    <tr>
                        <th class="px-4 py-3 font-medium">Nama Skill</th>
                        <th class="px-4 py-3 font-medium">Kategori</th>
                        <th class="px-4 py-3 font-medium">Platform</th>
                        <th class="px-4 py-3 font-medium">Author</th>
                        <th class="px-4 py-3 text-right font-medium">Favorit</th>
                    </tr>
                </thead>
                <!-- Dikosongkan karena di-render dinamis oleh script.js -->
                <tbody id="skills-tbody" class="divide-y divide-neutral-800">
                </tbody>
            </table>
        </div>

    </main>

    <footer class="border-t border-neutral-800 py-6 text-center text-xs text-neutral-500">
        <p>&copy; 2026 AI SkillHub</p>
    </footer>

    <!-- Import Library jQuery dan script interaktivitas -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
