<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Skill - AI SkillHub</title>
    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
    <!-- Font Geist -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black font-[Geist] text-sm text-neutral-200">

    <!-- Navbar -->
    <header class="border-b border-neutral-800">
        <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
            <a href="index.html" class="flex items-center gap-2 text-base font-semibold text-neutral-100">
                <img src="assets/images/logo.svg" alt="" width="28" height="28">
                AI SkillHub
            </a>
            <ul class="flex w-full flex-col gap-1 md:w-auto md:flex-row">
                <li><a href="index.html" class="block rounded px-3 py-2 text-neutral-400 hover:bg-neutral-900 hover:text-neutral-100">Dashboard</a></li>
                <li><a href="skills.html" class="block rounded px-3 py-2 text-neutral-400 hover:bg-neutral-900 hover:text-neutral-100">Jelajah</a></li>
                <li><a href="skill-form.html" aria-current="page" class="block rounded px-3 py-2 text-neutral-100 hover:bg-neutral-900">Submit</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto max-w-xl px-4 py-8">

        <div class="mb-8 text-center">
            <h1 class="text-2xl font-semibold text-neutral-100">Submit Skill</h1>
            <p class="mt-1 text-neutral-400">Skill akan ditinjau admin sebelum dipublikasikan.</p>
        </div>

        <!-- Elemen Notifikasi (Awalnya disembunyikan via CSS inline) -->
        <div id="notification" style="display: none;" class="mb-6 rounded border border-green-800 bg-green-950 p-3 text-center font-medium text-green-400">
            Skill berhasil dikirim dan menunggu review!
        </div>

        <form id="skill-form-element" class="space-y-4">
            <div>
                <label for="skill-name" class="mb-1.5 block font-medium">Nama</label>
                <input type="text" id="skill-name" name="skill_name"
                    class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 focus:border-neutral-300 focus:outline-none">
            </div>

            <div>
                <label for="skill-desc" class="mb-1.5 block font-medium">Deskripsi</label>
                <textarea id="skill-desc" name="skill_description" rows="3" required
                    class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 focus:border-neutral-300 focus:outline-none"></textarea>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="skill-category" class="mb-1.5 block font-medium">Kategori</label>
                    <select id="skill-category" name="skill_category" required
                        class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 focus:border-neutral-300 focus:outline-none">
                        <option value="design">Design</option>
                        <option value="development">Development</option>
                        <option value="security">Security</option>
                        <option value="data">Data</option>
                        <option value="writing">Writing</option>
                        <option value="research">Research</option>
                        <option value="automation">Automation</option>
                        <option value="productivity">Productivity</option>
                    </select>
                </div>
                <div>
                    <label for="skill-platform" class="mb-1.5 block font-medium">Platform AI</label>
                    <select id="skill-platform" name="ai_platform"
                        class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 focus:border-neutral-300 focus:outline-none">
                        <option value="general">General</option>
                        <option value="claude">Claude</option>
                        <option value="openai">OpenAI</option>
                        <option value="gemini">Gemini</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="skill-tags" class="mb-1.5 block font-medium">Tag</label>
                <input type="text" id="skill-tags" name="skill_tags" placeholder="UI, Figma"
                    class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 placeholder:text-neutral-500 focus:border-neutral-300 focus:outline-none">
            </div>

            <div>
                <label for="github-url" class="mb-1.5 block font-medium">URL GitHub</label>
                <input type="url" id="github-url" name="github_url" placeholder="https://github.com/..."
                    class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 placeholder:text-neutral-500 focus:border-neutral-300 focus:outline-none">
            </div>

            <div>
                <label for="skill-content" class="mb-1.5 block font-medium">Isi Skill</label>
                <textarea id="skill-content" name="skill_content" rows="8" required
                    class="w-full rounded border border-neutral-700 bg-neutral-950 px-3 py-2 font-mono text-xs focus:border-neutral-300 focus:outline-none"></textarea>
            </div>

            <button type="submit" class="w-full rounded bg-neutral-100 px-4 py-2 font-medium text-black hover:bg-neutral-300 sm:w-auto">Kirim Skill</button>
        </form>

    </main>

    <footer class="border-t border-neutral-800 py-6 text-center text-xs text-neutral-500">
        <p>&copy; 2026 AI SkillHub</p>
    </footer>

    <!-- Import Library jQuery dan script interaktivitas -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
