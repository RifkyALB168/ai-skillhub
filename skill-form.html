<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Skill - AI SkillHub</title>
    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="brand">
            <img src="assets/images/logo.svg" alt="Logo AI SkillHub" width="32" height="32">
            <h1>AI SkillHub</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="skills.html">Jelajah</a></li>
                <li><a href="skill-form.html" aria-current="page">Submit</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="submit-form">
            <div class="form-header">
                <h2>Submit Skill</h2>
                <p>Skill akan ditinjau admin sebelum dipublikasikan.</p>
            </div>

            <form action="skills.html" method="POST">
                <div class="form-group">
                    <label for="skill-name">Nama</label>
                    <input type="text" id="skill-name" name="skill_name" required>
                </div>

                <div class="form-group">
                    <label for="skill-desc">Deskripsi</label>
                    <textarea id="skill-desc" name="skill_description" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="skill-category">Kategori</label>
                    <select id="skill-category" name="skill_category" required>
                        <option value="design">Design</option>
                        <option value="development">Development</option>
                        <option value="security">Security</option>
                        <option value="data">Data</option>
                        <option value="writing">Writing</option>
                        <option value="research">Research</option>
                        <option value="automation">Automation</option>
                        <option value="productivity">Productivity</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="skill-platform">Platform AI</label>
                    <select id="skill-platform" name="ai_platform">
                        <option value="general">General</option>
                        <option value="claude">Claude</option>
                        <option value="openai">OpenAI</option>
                        <option value="gemini">Gemini</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="skill-tags">Tag</label>
                    <input type="text" id="skill-tags" name="skill_tags" placeholder="UI, Figma">
                </div>

                <div class="form-group">
                    <label for="github-url">URL GitHub</label>
                    <input type="url" id="github-url" name="github_url" placeholder="https://github.com/...">
                </div>

                <div class="form-group">
                    <label for="skill-content">Isi Skill</label>
                    <textarea id="skill-content" name="skill_content" rows="8" required></textarea>
                </div>

                <button type="submit">Kirim Skill</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AI SkillHub</p>
    </footer>

</body>
</html>
